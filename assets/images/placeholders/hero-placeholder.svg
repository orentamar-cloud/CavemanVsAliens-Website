<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="heroTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="heroTitle">Hero artwork placeholder, 1600 by 900</title>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12151a"/>
      <stop offset="55%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>
    <radialGradient id="heroGlowA" cx="18%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlowB" cx="86%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#8b7bff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlowC" cx="50%" cy="105%" r="60%">
      <stop offset="0%" stop-color="#34e39a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#34e39a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="heroGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#heroBg)"/>
  <rect width="1600" height="900" fill="url(#heroGrid)"/>
  <rect width="1600" height="900" fill="url(#heroGlowA)"/>
  <rect width="1600" height="900" fill="url(#heroGlowB)"/>
  <rect width="1600" height="900" fill="url(#heroGlowC)"/>

  <!-- abstract "ridge" horizon shapes -->
  <path d="M0 620 L220 520 L430 600 L640 480 L860 590 L1080 470 L1300 580 L1600 500 L1600 900 L0 900 Z" fill="#0d0f13" opacity="0.9"/>
  <path d="M0 700 L260 640 L520 690 L780 620 L1040 680 L1300 630 L1600 660 L1600 900 L0 900 Z" fill="#111318"/>

  <!-- distant UFO silhouette, abstract -->
  <ellipse cx="1220" cy="230" rx="90" ry="16" fill="#8b7bff" opacity="0.55"/>
  <ellipse cx="1220" cy="214" rx="42" ry="24" fill="#8b7bff" opacity="0.35"/>
  <circle cx="1220" cy="230" r="4" fill="#c9ffe9"/>
  <circle cx="1180" cy="234" r="3" fill="#c9ffe9" opacity="0.7"/>
  <circle cx="1260" cy="234" r="3" fill="#c9ffe9" opacity="0.7"/>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <rect x="40" y="40" width="1520" height="820" rx="24"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="800" y="452" fill="#f5f6f8" font-size="30" font-weight="700" letter-spacing="2">HERO ARTWORK PLACEHOLDER</text>
    <text x="800" y="486" fill="#8b909c" font-size="17" letter-spacing="1">1600 × 900 · replace with real cinematic key art</text>
  </g>
</svg>
